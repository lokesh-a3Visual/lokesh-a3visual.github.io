/* Layout: an investigator's desk at night. A torch-lit evidence wall opens the page, then manila case folders lie across the desk. */
:root{
  --ink:#0c0a09; --desk:#16110f; --soot:#261d19; --manila:#d6b981; --manila-dk:#b4955f;
  --paper:#eee4d0; --red:#c9151e; --red-hi:#ef3a40; --bone:#f4eee4; --dust:#b3a597;
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --type:"Special Elite","Courier New",Courier,monospace;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.04;margin:0;text-wrap:balance;letter-spacing:.012em;text-transform:uppercase}
p{margin:0}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-family:var(--type);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border:1px solid var(--bone);background:transparent;color:var(--bone);font-family:var(--type);font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .18s,color .18s,border-color .18s}
.btn:hover{background:var(--bone);color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--bone)}
.btn.red:hover{background:var(--red-hi);border-color:var(--red-hi);color:var(--ink)}

/* Entry */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 42%,#2b1512 0,var(--ink) 62%);perspective:1400px;overflow:hidden;transition:opacity .75s ease .55s,visibility 0s linear 1.3s}
.gate.open{opacity:0;visibility:hidden;pointer-events:none}
.gate-in{display:grid;justify-items:center;gap:46px;width:min(480px,100%)}
.gate-line{font-family:var(--type);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);text-align:center}
.folder{position:relative;width:100%;aspect-ratio:1.32;max-height:58vh;transform-style:preserve-3d;animation:rise 1s ease both}
.folder-back{position:absolute;inset:0;background:var(--ink);border:1px solid var(--manila-dk);display:grid;place-items:center;padding:20px;text-align:center}
.folder-back h1{font-size:clamp(34px,10vw,50px);color:var(--bone)}
.folder-back h1 b{color:var(--red-hi);font-weight:400}
.cover{position:absolute;inset:0;background:var(--manila);color:var(--ink);padding:9% 8%;display:flex;flex-direction:column;justify-content:space-between;transform-origin:left center;transition:transform 1.05s cubic-bezier(.6,.05,.3,1);box-shadow:0 26px 70px #000c;backface-visibility:hidden}
.cover::before{content:"CASE FILE";position:absolute;left:0;top:-30px;height:31px;padding:8px 26px 0 14px;background:var(--manila);font-family:var(--type);font-size:13px;letter-spacing:.14em;clip-path:polygon(0 0,86% 0,100% 100%,0 100%)}
.gate.open .cover{transform:rotateY(-128deg)}
.gate.open .folder{animation:plunge 1.25s ease-in forwards}
.cover-name{max-width:60%;font-family:var(--display);font-size:clamp(32px,9vw,46px);line-height:1.04;text-transform:uppercase}
.cover-meta{font-family:var(--type);font-size:13px;letter-spacing:.06em;line-height:1.7}
.cover .stamp{position:absolute;right:7%;bottom:12%;transform:rotate(-9deg)}
.stamp{display:inline-block;padding:3px 9px;border:2px solid currentColor;color:var(--red);font-family:var(--type);font-size:13px;letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes plunge{55%{transform:scale(1)}100%{transform:scale(2.5)}}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--soot)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.brand b{color:var(--red-hi);font-weight:400}

.brand{display:inline-flex;align-items:center;gap:10px}
.brand .logo{width:44px;height:44px}
.cover .logo{position:absolute;right:7%;top:8%;width:30%;aspect-ratio:1}
.about-mark{width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.nav{display:flex;gap:20px;flex-wrap:wrap}
.nav a{font-family:var(--type);font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--dust)}
.nav a:hover{color:var(--bone)}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:center;padding-block:44px 56px}
.hero-copy{display:grid;gap:20px;min-width:0}
.hero h2{font-size:clamp(46px,7.4vw,92px)}
.hero h2 em{font-style:normal;background:var(--red);padding:0 .14em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lede{max-width:34em;color:var(--dust);font-size:19px}
.clock{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding-block:12px;border-block:1px solid var(--soot)}
.clock output{font-family:var(--type);font-size:28px;color:var(--bone);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.wall{position:relative;height:clamp(390px,44vw,540px);max-width:100%;overflow:hidden;background:repeating-linear-gradient(92deg,#2a201b 0 3px,#241b17 3px 7px);border:1px solid var(--soot);touch-action:pan-y}
.wall svg.strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wall line{stroke:var(--red-hi);stroke-width:1.6}
.wall{--cw:clamp(128px,15vw,178px)}
.pin-card{position:absolute;width:var(--cw);padding:7px 7px 8px;background:var(--paper);color:var(--ink);box-shadow:0 8px 18px #0009;transform:rotate(var(--r));text-decoration:none;font-family:var(--type);font-size:12px;line-height:1.25;border:0;cursor:pointer;text-align:left}
.pin-card::before{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--red-hi);box-shadow:0 2px 3px #000a}
.pin-card svg{display:block;width:100%;aspect-ratio:1.5;background:var(--desk);color:var(--dust);margin-bottom:6px}
.photo svg{display:block;width:100%;aspect-ratio:1.55;background:var(--desk);color:var(--dust)}
.torch{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 210px at var(--x,62%) var(--y,44%),transparent 0,#08060538 52%,#080605e0 100%)}
.wall-note{position:absolute;left:0;bottom:0;padding:5px 10px;background:var(--ink);color:var(--bone);font-size:11px}

/* Sections */
.band{padding-block:56px;border-top:1px solid var(--soot)}
.band.desk{background:var(--desk)}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px 32px;flex-wrap:wrap;margin-bottom:30px}
.head h2{font-size:clamp(36px,5vw,58px)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:34px}
.tools input{min-height:44px;padding:9px 12px;background:var(--ink);border:1px solid var(--dust);color:var(--bone);font-family:var(--type);font-size:15px;width:100%}
#case-search{flex:1 1 240px;width:auto;min-width:0}
.chip{min-height:44px;padding:8px 14px;background:transparent;border:1px solid var(--soot);color:var(--dust);font-family:var(--type);font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--bone);border-color:var(--bone);color:var(--ink)}
.chip:hover{border-color:var(--bone)}
.files{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:44px 22px}
.file{text-decoration:none;position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:14px;background:var(--manila);color:var(--ink);border:0;text-align:left;font:inherit;cursor:pointer;transition:transform .2s}
.file::before{content:attr(data-no);position:absolute;left:0;top:-24px;height:25px;padding:6px 24px 0 11px;background:var(--manila);font-family:var(--type);font-size:12px;letter-spacing:.1em;clip-path:polygon(0 0,84% 0,100% 100%,0 100%)}
.file:hover{transform:translateY(-5px) rotate(-.5deg)}
.photo{background:var(--paper);padding:7px}
.file h3{font-family:var(--type);font-size:15px;letter-spacing:.03em;line-height:1.3}
.file .stamp{align-self:flex-start;margin-top:auto;font-size:12px;transform:rotate(-2deg)}
.next-tile{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0;padding:20px;border:1px dashed var(--dust)}
.next-tile output{font-family:var(--type);font-size:24px;font-variant-numeric:tabular-nums}
.none{grid-column:1/-1;padding:32px;border:1px dashed var(--dust);color:var(--dust);font-family:var(--type)}
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--soot);border:1px solid var(--soot)}
.channel{display:flex;flex-direction:column;gap:10px;min-width:0;padding:26px 24px;background:var(--ink);text-decoration:none;transition:background .18s}
.channel:hover{background:var(--soot)}
.channel h3{font-size:32px}
.channel p{color:var(--dust)}
.channel .go{margin-top:auto;padding-top:8px;font-family:var(--type);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--red-hi)}
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px}
.about div{display:grid;gap:14px;max-width:38em;color:var(--dust)}
footer{padding-block:26px;border-top:1px solid var(--soot);color:var(--dust);font-size:14px}

.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 20px}
.vid{text-decoration:none;display:grid;gap:10px;align-content:start;min-width:0;padding:0;background:none;border:0;color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.35;text-align:left;cursor:pointer}
.vid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:7px solid var(--paper);transition:transform .2s}
.vid:hover img{transform:scale(1.02)}

@media(max-width:1020px){.files,.vids{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.hero,.about{grid-template-columns:minmax(0,1fr)}.channels{grid-template-columns:minmax(0,1fr)}.pin-card{font-size:11px}.pin-card.far{display:none}}
@media(max-width:520px){.files,.vids{grid-template-columns:minmax(0,1fr)}.nav{gap:14px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function ytSearch(t){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(CH+(t?' '+t:''))}
function profile(k){
 var u=safe(S.links[k]);
 if(u)return u;
 if(k==='youtube')return ytSearch('');
 if(k==='facebook')return 'https://www.facebook.com/search/top?q='+encodeURIComponent(CH);
 return 'https://www.instagram.com/';
}
var G={
 ship:'<path d="M18 74h84l-10 16H30z" fill="currentColor"/><path d="M60 16v58M60 22 34 66h26zM60 28l26 38H60z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 96c9-6 18-6 27 0s18 6 27 0 18-6 27 0 18 6 27 0" fill="none" stroke="currentColor" stroke-width="3"/>',
 plane:'<path d="M12 62 50 54 74 26h9L72 52l26-6 8-11h7l-5 17 9 13-7 2-10-8-27 7 8 25h-8L54 69 16 73z" fill="currentColor"/><circle cx="60" cy="52" r="42" fill="none" stroke="currentColor" stroke-dasharray="4 7" stroke-width="2"/>',
 temple:'<path d="M60 8 66 22H54zM50 24h20l5 15H45zM41 41h38l5 15H36zM32 58h56l5 15H27zM20 75h80v21H20z" fill="currentColor"/>',
 stone:'<path d="M28 72 38 38 66 26l28 18 6 30-22 16H42z" fill="currentColor"/><path d="M6 96h108" stroke="currentColor" stroke-width="3"/>',
 road:'<path d="M46 8h28l34 90H12z" fill="currentColor"/><path d="M60 16v12M60 38v16M60 66v24" stroke="#16110f" stroke-width="4"/>',
 mark:'<path d="M60 8a30 30 0 0 0-30 30c0 24 30 58 30 58s30-34 30-58A30 30 0 0 0 60 8z" fill="currentColor"/><text x="60" y="52" text-anchor="middle" font-size="36" fill="#16110f" font-family="Georgia,serif">?</text>'
};
function glyph(k){return '<svg viewBox="-30 0 180 104" aria-hidden="true">'+(G[k]||G.mark)+'</svg>'}
var VIDS=[];
var KEYS={tiruchendur:['tiruchendur','thiruchendur','tiruchendhur','திருச்செந்தூர்'],thanjavur:['thanjavur','tanjore','brihadeeswar','brihadisvara','தஞ்சை'],'kerala-benz':['benz'],sophia:['sophia','koetsier','uganda'],stoneman:['stoneman','stone man','stonemen'],bermuda:['bermuda','flight 19','cyclops'],'mary-celeste':['mary celeste','மேரி செலஸ்ட்']};
function vurl(v){return 'https://www.youtube.com/watch?v='+v.id}
function best(f){
 var k=KEYS[f.id]||[f.subject.toLowerCase()];
 var m=VIDS.filter(function(v){var t=v.title.toLowerCase();return k.some(function(w){return t.indexOf(w)>-1})});
 return m.filter(function(v){return !v.shorts})[0]||m[0];
}
function link(f){
 if(safe(f.youtube))return f.youtube;
 var v=best(f);return v?vurl(v):ytSearch(f.subject);
}
function media(f){return glyph(f.glyph)}
function attrs(f){return 'href="'+e(link(f))+'" target="_blank" rel="noopener" data-case="'+e(f.id)+'"'}
function fileCard(f,i){
 return '<a class="file" '+attrs(f)+' data-no="'+no(i)+'" title="'+e(f.summary)+'"><div class="photo">'+media(f)+'</div><h3>'+e(f.place)+' | '+e(f.subject)+'</h3><span class="stamp">'+e(f.status)+'</span></a>';
}
function visible(){
 var q=query.trim().toLowerCase();
 return S.files.filter(function(f){
  var cat=filter==='All'||f.cat===filter||(filter==='Unsolved'&&/unsolved|unexplained|never caught|missing/i.test(f.status));
  return cat&&(!q||(f.place+' '+f.subject+' '+f.summary).toLowerCase().indexOf(q)>-1);
 });
}
function grid(){
 var v=visible(), h=v.map(function(f){return fileCard(f,S.files.indexOf(f))}).join('');
 if(!v.length)h='<p class="none">No file matches that search. Try a place, a name or a year.</p>';
 else if(filter==='All'&&!query)h+='<div class="next-tile"><span class="label">Next file opens in</span><output data-clock>--:--:--</output><span>New case every day at 3 PM IST</span></div>';
 document.getElementById('grid').innerHTML=h;tick();
}
function pins(){
 var P=[['72%','7%','-3deg',''],['8%','9%','2deg',''],['40%','33%','-1.5deg',''],['73%','57%','3deg',''],['5%','58%','-2deg','far'],['40%','71%','1.5deg','far']];
 return S.files.slice(0,6).map(function(f,i){var p=P[i];
  return '<a class="pin-card '+p[3]+'" style="left:min('+p[0]+',calc(100% - var(--cw) - 12px));top:min('+p[1]+',calc(100% - 178px));--r:'+p[2]+'" '+attrs(f)+'>'+media(f)+e(f.place)+' | '+e(f.subject)+'</a>'}).join('');
}
function render(){
 root.innerHTML=
 '<div class="gate" id="gate"><div class="gate-in"><p class="gate-line">Some of these cases were never solved</p><div class="folder"><div class="folder-back"><h1>Lokesh <b>Mystery</b> Files</h1></div><div class="cover"><span class="logo" role="img" aria-label="Lokesh Mystery Files logo"></span><div class="cover-name">Lokesh Mystery Files</div><div class="cover-meta">SUBJECT: UNSOLVED<br>FILES ON RECORD: '+String(S.files.length).padStart(3,'0')+'<br>ACCESS: ALL WHO DARE</div><span class="stamp">Classified</span></div></div><button class="btn red" id="enter">Open the file</button></div></div>'+
 '<header class="top"><div class="wrap top-in"><a class="brand" href="#files-section"><span class="logo" aria-hidden="true"></span><span>Lokesh <b>Mystery</b> Files</span></a><nav class="nav" aria-label="Sections"><a href="#videos">Latest videos</a><a href="#files-section">Case archive</a><a href="#follow">Follow</a><a href="#about">About</a></nav></div></header>'+
 '<main><div class="wrap hero"><div class="hero-copy"><p class="label">True crime and unsolved mysteries, narrated in Tamil</p><h2>Every file <em>hides</em> a question</h2><p class="lede">Real cases, old secrets and disappearances, told as a documentary. Pick a file. Follow the string.</p><div class="clock"><span class="label">Next file opens in</span><output data-clock>--:--:--</output></div><div class="acts"><a class="btn red" id="latest" href="'+e(profile('youtube'))+'" target="_blank" rel="noopener">Watch the latest video</a><button class="btn" id="random">Watch a random case</button></div></div>'+
 '<div class="wall" id="wall"><svg class="strings" id="strings" aria-hidden="true"></svg>'+pins()+'<div class="torch"></div><span class="wall-note label">Move your torch across the wall</span></div></div>'+
 '<section class="band" id="videos" hidden><div class="wrap"><div class="head"><h2>Latest videos</h2><a class="btn" href="'+e(profile('youtube'))+'" target="_blank" rel="noopener">All videos on YouTube</a></div><div class="vids" id="vids"></div></div></section>'+
 '<section class="band desk" id="files-section"><div class="wrap"><div class="head"><h2>Case archive</h2><p class="label">'+S.files.length+' files on record</p></div><div class="tools"><input id="case-search" type="search" placeholder="Search a place, a name, a year" aria-label="Search the case archive" value="'+e(query)+'">'+['All'].concat(CATS).map(function(c){return '<button class="chip" data-cat="'+c+'" aria-pressed="'+(c===filter)+'">'+c+'</button>'}).join('')+'</div><div class="files" id="grid"></div></div></section>'+
 '<section class="band" id="follow"><div class="wrap"><div class="head"><h2>Follow the investigation</h2></div><div class="channels">'+
 '<a class="channel" href="'+e(profile('youtube'))+'" target="_blank" rel="noopener"><h3>YouTube</h3><p>Full case documentaries and Shorts. New video every day at 3 PM IST.</p><span class="go">Subscribe</span></a>'+
 '<a class="channel" href="'+e(profile('instagram'))+'" target="_blank" rel="noopener"><h3>Instagram</h3><p>Daily reels on true crime, unsolved mysteries and ocean mysteries.</p><span class="go">Follow</span></a>'+
 '<a class="channel" href="'+e(profile('facebook'))+'" target="_blank" rel="noopener"><h3>Facebook</h3><p>Every case in your feed, ready to share and discuss.</p><span class="go">Follow</span></a>'+
 '</div></div></section>'+
 '<section class="band desk" id="about"><div class="wrap about"><div style="display:grid;gap:22px"><h2>Who keeps these files</h2><span class="logo about-mark" role="img" aria-label="Lokesh Mystery Files logo"></span></div><div><p>Lokesh Mystery Files retells true crime, unsolved mysteries and historical secrets in Tamil, in a documentary style.</p><p>Every story is about real people. The channel tells these cases with respect for victims and their families.</p></div></div></section></main>'+
 '<footer><div class="wrap">Lokesh Mystery Files. Case details are retold from public reports for commentary and education.</div></footer>'+
 ''
 grid();strings();
}
function strings(){
 var w=document.getElementById('wall'),s=document.getElementById('strings');if(!w||!s)return;
 var b=w.getBoundingClientRect(),pts=[].slice.call(w.querySelectorAll('.pin-card')).filter(function(c){return c.offsetParent}).map(function(c){var r=c.getBoundingClientRect();return[r.left+r.width/2-b.left,r.top+2-b.top]});
 var order=[0,2,1,4,5,3,0,2].filter(function(i){return pts[i]}),h='';
 order.forEach(function(p,i){if(i){var a=pts[order[i-1]],c=pts[p];h+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+c[0]+'" y2="'+c[1]+'"/>'}});
 s.innerHTML=h;
}
function tick(){
 var d=864e5,t=(Date.now()+198e5)%d,left=Math.floor(((54e6-t+d)%d)/1e3);
 var s=[Math.floor(left/3600),Math.floor(left/60)%60,left%60].map(function(n){return String(n).padStart(2,'0')}).join(':');
 [].forEach.call(document.querySelectorAll('[data-clock]'),function(o){o.textContent=s});
}
setInterval(tick,1000);
document.addEventListener('click',function(ev){
 var t=ev.target,c=t.closest('[data-cat]');
 if(c){filter=c.getAttribute('data-cat');[].forEach.call(document.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',x===c)});grid()}

 else if(t.id==='enter')enter();
 else if(t.id==='random')window.open(link(S.files[Math.floor(Math.random()*S.files.length)]),'_blank','noopener');
});
document.addEventListener('input',function(ev){if(ev.target.id==='case-search'){query=ev.target.value;grid()}});
function videos(list){
 VIDS=list.filter(function(v){return /^[\w-]{6,20}$/.test(v.id)});if(!VIDS.length)return;
 document.getElementById('vids').innerHTML=VIDS.slice(0,9).map(function(v){
  return '<a class="vid" href="'+e(vurl(v))+'" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/'+e(v.id)+'/hqdefault.jpg" alt=""><span>'+e(v.title)+'</span></a>'}).join('');
 document.getElementById('videos').hidden=false;
 document.getElementById('latest').href=vurl((VIDS.filter(function(v){return !v.shorts})[0])||VIDS[0]);
 [].forEach.call(document.querySelectorAll('.pin-card[data-case]'),function(a){var f=S.files.filter(function(x){return x.id===a.getAttribute('data-case')})[0];if(f){a.href=link(f);a.innerHTML=media(f)+e(f.place)+' | '+e(f.subject)}});
 grid();
}
fetch('videos.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(videos).catch(function(){});
function enter(){
 var g=document.getElementById('gate');if(!g||g.classList.contains('open'))return;
 g.classList.add('open');document.body.classList.remove('locked');
 try{sessionStorage.setItem('lmf-entered','1')}catch(x){}
 setTimeout(strings,1400);
}
var seen=false;try{seen=sessionStorage.getItem('lmf-entered')==='1'}catch(x){}
render();
if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('gate').remove();
else{document.body.classList.add('locked');setTimeout(enter,9000)}
addEventListener('resize',strings);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(strings);
/* Torch */
var wall=document.getElementById('wall'),moved=0;
function aim(x,y){wall.style.setProperty('--x',x+'px');wall.style.setProperty('--y',y+'px')}
wall.addEventListener('pointermove',function(ev){var r=wall.getBoundingClientRect();moved=Date.now();aim(ev.clientX-r.left,ev.clientY-r.top)});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)(function drift(ts){
 if(Date.now()-moved>2500){var w=wall.clientWidth,h=wall.clientHeight;aim(w*(.5+.38*Math.sin(ts/2900)),h*(.5+.34*Math.cos(ts/2100)))}
 requestAnimationFrame(drift);
})(0);
tick();
})();
</script>
