name: Update site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 3:20 PM and 6:20 PM IST, just after the daily 3 PM upload
    - cron: "50 9 * * *"
    - cron: "50 12 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new YouTube videos
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request
          import xml.etree.ElementTree as ET

          HANDLE = "Lokeshmysteryfiles"
          HEAD = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9", "Cookie": "SOCS=CAI; CONSENT=YES+cb"}
          NS = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}

          def get(url):
              req = urllib.request.Request(url, headers=HEAD)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")

          def initial_data(page):
              m = re.search(r"ytInitialData\s*=\s*", page)
              if not m:
                  return None
              try:
                  return json.JSONDecoder().raw_decode(page[m.end():])[0]
              except ValueError:
                  return None

          def walk(o, out, shorts):
              if isinstance(o, dict):
                  vid, title = o.get("videoId"), None
                  t = o.get("title")
                  if isinstance(t, dict):
                      title = t.get("simpleText") or "".join(r.get("text", "") for r in t.get("runs", [])) or None
                  if vid and title:
                      out.setdefault(vid, (title, shorts))
                  if "shortsLockupViewModel" in o:
                      s = o["shortsLockupViewModel"]
                      vid = s.get("onTap", {}).get("innertubeCommand", {}).get("reelWatchEndpoint", {}).get("videoId")
                      title = s.get("overlayMetadata", {}).get("primaryText", {}).get("content")
                      if vid and title:
                          out.setdefault(vid, (title, True))
                  for v in o.values():
                      walk(v, out, shorts)
              elif isinstance(o, list):
                  for v in o:
                      walk(v, out, shorts)

          def from_tabs():
              found = {}
              for tab, shorts in (("videos", False), ("shorts", True)):
                  try:
                      data = initial_data(get(f"https://www.youtube.com/@{HANDLE}/{tab}"))
                      print(tab, "page data found:", bool(data))
                      if data:
                          walk(data, found, shorts)
                  except Exception as e:
                      print(tab, "page failed:", e)
              now = time.time()
              return [{"id": k, "title": v[0], "shorts": v[1], "scraped": True,
                       "published": time.strftime("%Y-%m-%dT%H:%M:%S+00:00", time.gmtime(now - i * 60))}
                      for i, (k, v) in enumerate(found.items())]

          def from_feed():
              page = get(f"https://www.youtube.com/@{HANDLE}")
              m = re.search(r'"(?:externalId|channelId|browseId)":"(UC[\w-]{22})"', page) or re.search(r'channel[/_=]+(UC[\w-]{22})', page)
              if not m:
                  raise RuntimeError("channel ID not found")
              print("channel", m.group(1))
              xml = get(f"https://www.youtube.com/feeds/videos.xml?channel_id={m.group(1)}")
              out = []
              for en in ET.fromstring(xml).findall("a:entry", NS):
                  out.append({"id": en.find("yt:videoId", NS).text, "title": en.find("a:title", NS).text,
                              "published": en.find("a:published", NS).text,
                              "shorts": "/shorts/" in en.find("a:link", NS).get("href", "")})
              return out

          def merge(old, new):
              seen = {v["id"]: v for v in old}
              for v in new:
                  scraped = v.pop("scraped", False)
                  if scraped and v["id"] in seen:
                      v["published"] = seen[v["id"]]["published"]
                  seen[v["id"]] = v
              return sorted(seen.values(), key=lambda v: v["published"], reverse=True)

          if __name__ == "__main__":
              with open("videos.json", encoding="utf-8") as f:
                  old = json.load(f)
              new = []
              try:
                  new = from_feed()
                  print("feed videos:", len(new))
              except Exception as e:
                  print("feed failed:", e)
              if not new:
                  new = from_tabs()
                  print("page videos:", len(new))
              if not new:
                  raise SystemExit("No videos found")
              with open("videos.json", "w", encoding="utf-8") as f:
                  json.dump(merge(old, new), f, ensure_ascii=False, indent=1)
          PY
      - name: Save video list
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Update videos" && git push)
      - id: pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html videos.json logo.jpg _site/
          sed -i "s#__SITE_URL__#${{ steps.pages.outputs.base_url }}#g" _site/index.html
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "${{ steps.pages.outputs.base_url }}" > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>%s/</loc></url></urlset>\n' "${{ steps.pages.outputs.base_url }}" > _site/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
